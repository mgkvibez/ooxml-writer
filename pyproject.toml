[project]
name = "ooxml-writer"
version = "0.0.1"
description = "Edit OOXML instead of only rendering it: fidelity on the write path"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# python-pptx is a *test* dependency and only that: the library itself has none. The tests open the saved deck with it
# so an independent reader confirms the edits, which is the point of the exercise; CI has to be able to run them.
dev = ["pytest>=8", "ruff>=0.6", "python-pptx>=0.6.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Pinned in-repo so lint means the same thing on every machine, instead of inheriting a parent directory's config.
[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A fresh checkout runs the documented command verbatim. Without this, `pytest` fails
# collection with ModuleNotFoundError and the repo reads as broken when it is not.
pythonpath = ["src"]
